name: CI/CD to Azure Container Registry

on:
  push:
    branches: [ "master" ]
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE_NAME: todo-list

jobs:
  ci:
    name: CI - Build and scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t $IMAGE_NAME:${{ github.sha }} .

      - name: Security scan with Trivy
        run: docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.57.1 image --severity CRITICAL --ignore-unfixed --exit-code 1 $IMAGE_NAME:${{ github.sha }}

      - name: Save image
        run: docker save $IMAGE_NAME:${{ github.sha }} | gzip > image.tar.gz

      - name: Upload image
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: image.tar.gz
          retention-days: 1

  cd:
    name: CD - Push to ACR
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - name: Download image
        uses: actions/download-artifact@v4
        with:
          name: docker-image

      - name: Load image
        run: gunzip -c image.tar.gz | docker load

      - name: Log in to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Tag image with commit
        run: docker tag $IMAGE_NAME:${{ github.sha }} ${{ secrets.ACR_LOGIN_SERVER }}/$IMAGE_NAME:${{ github.sha }}

      - name: Tag image as latest
        run: docker tag $IMAGE_NAME:${{ github.sha }} ${{ secrets.ACR_LOGIN_SERVER }}/$IMAGE_NAME:latest

      - name: Push commit tag
        run: docker push ${{ secrets.ACR_LOGIN_SERVER }}/$IMAGE_NAME:${{ github.sha }}

      - name: Push latest tag
        run: docker push ${{ secrets.ACR_LOGIN_SERVER }}/$IMAGE_NAME:latest

      - name: List tags in registry
        env:
          ACR_LOGIN_SERVER: ${{ secrets.ACR_LOGIN_SERVER }}
          ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
        run: curl -fsS -u "$ACR_USERNAME:$ACR_PASSWORD" "https://$ACR_LOGIN_SERVER/v2/$IMAGE_NAME/tags/list" | tee tags.json

      - name: Verify image exists in registry
        run: grep -q "${{ github.sha }}" tags.json
